# ### Task 4: Multi-line Strings
# In `server.yaml`, add a `startup_script` field using:
# 1. The `|` block style (preserves newlines)
# 2. The `>` fold style (folds into one line)

# Write in your notes: When would you use `|` vs `>`?

# 1. The `|` block style (preserves newlines)
server: 
  name: nowhere
  ip: 1.1.22.3
  port: 235
startup_script: |
  #!/bin/bash
  echo "hello this is block style (preserves new lines)"
  echo "second line will be print on second line"
Used for:
  - Shell scripts:
  - Config files:
  - Certificates:
  - Logs:

# 2. The `>` fold style (folds into one line)
databse:
  host: thor
  name: thorodinson
  credentials: 
    user: thoring
    password: test123
startup_script:
  #!/bin/bash
  echo "This is fold style (more like one paragaraph type output"
  echo "second will be print in countiounation of first line right after (output - second line)"

Used for:
  - Long text:
  - Descriptions:
  - Messages:
  - Documentation:


